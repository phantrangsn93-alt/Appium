# ===== Default configuration =====
# Priority (highest first): JVM -Dkey=value  >  environment variable / .env (KEY_NAME)  >  config-<env>.properties  >  this file
env=sit

# ---- Appium server ----
appium.server.url=http://127.0.0.1:4723
# true: framework starts a local Appium server (bound to 127.0.0.1) if none is reachable
appium.server.autostart=true

# ---- Device / app ----
platform.name=Android
device.udid=dabfffa4
device.name=Mi MIX 2S
app.package=com.bsc.mobiletrading
app.activity=.MainActivity
# Path to APK for fresh install (empty = use app already installed on device)
app.path=
no.reset=true
full.reset=false
new.command.timeout=300
system.port=8200
# Parallel execution: device pool "udid:systemPort" (comma separated, unique ports). Empty = device.udid only.
# e.g. devices=dabfffa4:8200,emulator-5554:8201
devices=

# ---- iOS (XCUITest) - used when platform.name=iOS (run: mvn test -Dplatform.name=iOS, or PLATFORM_NAME=iOS in .env) ----
# Real device: "Triang" iOS 18.7.8. Signing: IOS_XCODE_ORG_ID (Apple Team ID) belongs in .env, not here.
ios.udid=00008140-000114E421DB801C
ios.device.name=iPhone
ios.platform.version=
# Bundle id of the BSC app installed on the iPhone (check: xcrun devicectl device info apps --device <udid>)
ios.bundle.id=com.bsc.mobiletrading
# Path to .ipa/.app for fresh install (empty = use the app already installed)
ios.app.path=
ios.wda.port=8100
# WebDriverAgent bundle id must be unique for a free/personal team, e.g. vn.bsc.qa.WebDriverAgentRunner
ios.wda.bundle.id=vn.bsc.qa.WebDriverAgentRunner
ios.xcode.signing.id=Apple Development
ios.wda.launch.timeout=180
ios.use.prebuilt.wda=false
# WDA already running on the iPhone (xcodebuild test-without-building ...): its URL, e.g. http://<iphone-ip>:8100
ios.wda.url=
# Folder of a WDA build (xcodebuild -derivedDataPath) reused with ios.use.prebuilt.wda=true
ios.derived.data.path=
ios.show.xcode.log=false
ios.snapshot.max.depth=62
# Parallel: ios.devices=udid1:8100,udid2:8101 (unique WDA ports)
ios.devices=

# ---- Timeouts (seconds) ----
timeout.explicit=20
timeout.short=5
timeout.app.launch=40

# ---- Manual input (username/password/PIN typed by a person on the device) ----
# Used when .env has no BSC_USERNAME/BSC_PASSWORD (login) and always for the order PIN.
manual.input.timeout=600

# ---- Execution ----
# true : one Appium session for the whole suite (re-used across classes, re-created if dead) - faster
# false: new session per test class (stronger isolation when debugging)
session.shared=true
retry.max.count=1
screenshot.on.pass=true
video.on.failure=true

# ---- Safety guard: this is a REAL trading app ----
# false (default): framework refuses to tap MUA/BAN unless quantity == 0 (validation only).
# true  : ONLY for the Excel real-order scenario, enable per run:  mvn test -Dorder.submit.enabled=true
#         The placed order is cancelled automatically at the end of the test.
order.submit.enabled=false

# ---- Order post-conditions (verified after every accepted order / modify / cancel) ----
# Result message per side (regex, Vietnamese text compared in NFC)
order.success.buy.pattern=(?is).*mua.*thành công.*|.*thành công.*mua.*
order.success.sell.pattern=(?is).*bán.*thành công.*|.*thành công.*bán.*
# Technical errors: ALWAYS a test failure, even outside the session (add codes with |)
order.systemError.pattern=(?is).*(E_SYSTEM_ERROR|Lỗi hệ thống).*
# Status column of "Sổ lệnh" (regex alternatives, case-insensitive)
order.status.placed=Đã gửi|Chờ gửi
order.status.modified=Đã sửa
order.status.cancelled=Đã huỷ|Đã hủy
# Conditional orders (Stop Limit / Trailing Stop / OCO) right after placing ("Điều kiện" filter).
# Business rule: conditional orders do NOT block buying power -> no balance check for them.
order.status.conditional.placed=Chờ kích hoạt
